# /etc/nginx/sites-available/cncms
# Replace YOUR_DOMAIN, symlink into sites-enabled, `nginx -t`, then
# `certbot --nginx -d YOUR_DOMAIN` (it adds the 443 block + redirect).

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    root /var/www/cncms/public;
    index index.php;

    charset utf-8;

    # Uploads: xlsx imports, company logos, receipt photos. Generous but bounded.
    client_max_body_size 30M;

    # Long-running exports (register PDF, bill generation kickoff). The heavy
    # rendering is queued, but the request that starts it and the register
    # PDF stream can still take a while.
    fastcgi_read_timeout 180;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Built Vite assets are content-hashed — cache hard.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Never serve dotfiles or the storage/vendor internals.
    location ~ /\.(?!well-known).* { deny all; }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    error_log  /var/log/nginx/cncms-error.log;
    access_log /var/log/nginx/cncms-access.log;
}
